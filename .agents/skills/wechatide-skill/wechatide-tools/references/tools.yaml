{
  "defaults": {
    "timeoutMs": 20000
  },
  "tools": [
    {
      "id": "check_wechatide_status",
      "name": "读取微信开发者工具状态",
      "summary": "只读获取登录态（loginExpired）、当前用户（loginUser）、skill 版本关系（versionRelation）、CLI 可选令牌（cliTokenRequired / 兼容字段 tokenRequired）以及 MCP 是否需要独立 Token（mcpTokenRequired，始终为 true）；不触发登录。wechatide -c / skill-call 走可选 CLI 令牌（未配置则不验，本工具还可跳过 CLI 令牌）；wechatide mcp / Inspector 等 MCP 入口始终需要独立 MCP Token。MCP 缺 Token 时应提示用户重新复制 MCP 配置；仅当 cliTokenRequired 为 true 时后续 CLI / skill-call 命令须带 CLI 令牌。",
      "group": "ide",
      "source": {
        "type": "wechatide"
      },
      "scenes": [
        "initializer"
      ],
      "inputSchema": {
        "skill-version": {
          "type": "string",
          "required": false,
          "description": "调用侧加载的 wechatide-skill 版本；会话首次必须传，不传时 versionRelation 为 skip_check"
        }
      },
      "execution": {
        "transport": "skill_call",
        "toolName": "check_wechatide_status"
      }
    },
    {
      "id": "close_project_window",
      "name": "关闭项目窗口",
      "summary": "关闭包含模拟器的项目窗口，不等于完全退出微信开发者工具",
      "group": "ide",
      "source": {
        "type": "wechatide"
      },
      "scenes": [
        "initializer"
      ],
      "inputSchema": {
        "project": {
          "type": "string",
          "required": true,
          "description": "项目本地绝对路径；根目录必须包含 project.config.json"
        }
      },
      "execution": {
        "transport": "skill_call",
        "toolName": "close_project_window"
      }
    },
    {
      "id": "open_project_window",
      "name": "打开项目窗口",
      "summary": "打开包含模拟器的项目窗口。如果之前窗口已存在，则不打开新窗口，直接返回已打开的窗口 ID",
      "group": "ide",
      "source": {
        "type": "wechatide"
      },
      "scenes": [
        "initializer"
      ],
      "inputSchema": {
        "project": {
          "type": "string",
          "required": true,
          "description": "项目本地绝对路径；根目录必须包含 project.config.json"
        },
        "windowMode": {
          "type": "string",
          "required": false,
          "enum": [
            "liteMode",
            "fullMode"
          ],
          "description": "窗口模式：默认 liteMode（仅模拟器）；fullMode 包含编辑器、模拟器和调试器"
        }
      },
      "execution": {
        "transport": "skill_call",
        "toolName": "open_project_window"
      }
    },
    {
      "id": "quit",
      "name": "退出工具",
      "summary": "关闭 WechatIDE。",
      "group": "ide",
      "source": {
        "type": "wechatide"
      },
      "scenes": [
        "initializer"
      ],
      "inputSchema": {},
      "execution": {
        "transport": "skill_call",
        "toolName": "quit"
      }
    },
    {
      "id": "login",
      "name": "触发扫码登录",
      "summary": "触发扫码登录并返回 taskId；可打开独立置顶窗口，或直接向 agent 返回二维码图片。",
      "group": "ide",
      "source": {
        "type": "wechatide"
      },
      "scenes": [
        "initializer"
      ],
      "inputSchema": {
        "type": {
          "type": "string",
          "enum": [
            "window",
            "image"
          ],
          "default": "window",
          "description": "二维码展示方式：window（默认）打开独立置顶窗口；image 直接返回二维码图片给 agent，且不切换开发者工具当前界面"
        }
      },
      "execution": {
        "transport": "skill_call",
        "toolName": "login"
      }
    },
    {
      "id": "polling_task_result",
